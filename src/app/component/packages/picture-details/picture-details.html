<div class="slider" (click)="onContainerClick($event)">

  <button class="nav left" (click)="prev()">&#8250;</button>

  <div class="image-container">

    <img
      class="image-main"
      [src]="images[currentIndex]?.imageUrl"
      [style.transform]="
        'scale(' + scale + ') translate(' + translateX + 'px,' + translateY + 'px)'
      "
      (wheel)="onWheel($event)"
      (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp($event)"
      (mouseleave)="onMouseUp($event)"
      draggable="false"
    />

  </div>

  <button class="nav right" (click)="next()">&#8249;</button>

</div>

<section class="thumbnails">

  @for(im of images; track im.imgId; let i = $index){

    <div class="thumb" (click)="select(i)">

      <img [src]="im.imageUrl">

    </div>

  }

</section>
