 <header class="header">
    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">Studio Simulations</div>
    </div>

    <nav class="nav">
      <a (click)="homePage()">חזרה לפרויקטים</a>
    </nav>
  </header>

<div class="slider" (click)="onContainerClick($event)">


  <div class="image-container">
    <img class="image-main" [src]="images[currentIndex]" [style.transform]="
        'scale(' + scale + ') translate(' + translateX + 'px,' + translateY + 'px)'
      " (wheel)="onWheel($event)" (mousedown)="onMouseDown($event)" (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp($event)" (mouseleave)="onMouseUp($event)" draggable="false" />
  </div>

</div>



<button class="nav left" (click)="prev()">&#8250;</button>



<button class="nav right" (click)="next()">&#8249;</button>


<section class="thumbnails">
  @for( i of images;track i;){

  <div class="thumb" (click)="select($index)">
    <img [src]="images[$index]">
  </div>
  }

</section>
