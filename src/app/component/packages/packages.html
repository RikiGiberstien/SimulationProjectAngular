<div class="portfolio">
  <header class="header">
    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">Studio Simulations</div>
    </div>

    <nav class="nav">
      <a (click)="homePage()">יציאה מהמערכת</a>
      @if(srv.curentcustomer.mail!=null){
      @if(srv.curentcustomer.mail=="meair@gmail.com"){
      <a (click)="cust()">לקוחות</a> }
      <a (click)="mypac()">חבילות</a>
      <a (click)="vieworders()">צפייה בנתונים</a>
      }
      <a (click)="recomms()">ממליצים</a>
      <a (click)="about()">אודות</a>
    </nav>
  </header>

  <router-outlet></router-outlet>

  <main class="portfolio-main">
    <h1>פרויקטים להתרשמות</h1>

    <!-- Dropdown לסינון לפי כותרת -->
    <div class="filter">
      <label for="project-select">בחר פרויקט:</label>
      <select id="project-select" [(ngModel)]="selectedProjectTitle" (change)="filterProjects()">
        <option value="all">הכל</option>
        <option *ngFor="let project of projects" [value]="project.title">
          {{project.title}}
        </option>
      </select>
    </div>

    <div class="projects-list">
      <!-- הצגת פרויקטים מסוננים -->
      <div *ngFor="let i of filteredProjects">
        <p>{{i.title}}</p>
        <p>{{i.description}}</p>
        <div class="image-container">
          <img [class.fade]="true" [src]="i.image" />
        </div>
        <button (click)="pictureDetails(i.id)">לפרטים נוספים</button>
      </div>
    </div>
  </main>
</div>
