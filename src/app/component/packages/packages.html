<div class="projects-list">
 
  @for(i of srv.list5$ | async; track i; let ind=$index){

      <p>{{ i.packageId }}</p>
      <div class="image-container">
        <img [class.fade]="true" [src]= "i.image" />
      </div>

      <button (click)="pictureDetails(i.id)">
        לפרטים נוספים
      </button>
    </div>

  }

</div>
