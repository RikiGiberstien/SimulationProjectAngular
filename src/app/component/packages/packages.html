    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">Studio Simulations</div>
    </div>

    <nav class="nav">
      <a (click)="homePage()">יציאה מהמערכת</a>
      @if(srv.curentcustomer.mail!=null){

      <a (click)="cust()">לקוחות</a> }

  <main class="portfolio-main">

    <h1>פרויקטים להתרשמות</h1>

        <button (click)="pictureDetails(1)">לפרטים נוספים</button>

      </div>
      }
