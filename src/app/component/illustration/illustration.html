<section class="packages-section">
    <div class="packages-title">בחרו את חבילת ההדמיה שמתאימה לכם</div>
    <div class="packages-list">
        <div class="package-card">

            <div class="customer-card">
                @for (i of srv.list2$ | async; track $index) {
                <button>תיאור: {{ i.description }}</button>

                }


                <input type="text" placeholder=" תאר לנו במה מדובר...">
                
                <button class="package-btn" (click)="personalerea()">להזמנה</button>
            </div>
        </div>


    </div>
</section>
